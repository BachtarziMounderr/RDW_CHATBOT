name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt -r requirements-ia.txt
      - name: Lancer les tests hors ligne
        run: python -m pytest -q
      - name: Vérifier la construction Docker
        run: docker build -t rdw-assistant-bot:test .
