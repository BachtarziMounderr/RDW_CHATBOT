services:
  - type: web
    name: rdw-assistant-bot
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "8080"
      - key: BOT_MODE
        value: assistant
      - key: TELEGRAM_TRANSPORT
        value: webhook
      - key: TELEGRAM_WEBHOOK_PATH
        value: /telegram/webhook
      - key: TELEGRAM_ACCESS_MODE
        value: public
      - key: TELEGRAM_ALLOWED_USER_IDS
        value: "7907520730,1953680558"
      - key: RDW_ADMIN_USER_IDS
        value: "7907520730,1953680558"
      - key: AI_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: DASHBOARD_ENABLED
        value: "true"
      - key: DASHBOARD_HOST
        value: 0.0.0.0
      - key: DASHBOARD_USERNAME
        value: rdw-admin
      - key: PRIVATE_CHANNEL_PRICE_DZD
        value: "1000"
      - key: PAYMENT_PROOF_TELEGRAM
        value: "0541501832"
      - key: BARIDIMOB_PAYMENT_DETAILS
        sync: false
      - key: CCP_PAYMENT_DETAILS
        sync: false
      - key: VIP_CHANNEL_ID
        sync: false
      - key: DEBUG_SOURCE_LABELS
        value: "false"
      - key: AI_MAX_CALLS_PER_USER_DAY
        value: "400"
      - key: AI_MAX_CALLS_PER_DAY
        value: "800"
      - key: AI_MAX_INPUT_CHARS
        value: "7000"
      - key: AI_MAX_OUTPUT_TOKENS
        value: "240"
      - key: AI_TIMEOUT_SECONDS
        value: "25"
      - key: AI_MAX_RETRIES
        value: "1"
      - key: AI_QUOTA_COOLDOWN_SECONDS
        value: "120"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
